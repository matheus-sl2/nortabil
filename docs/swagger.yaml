openapi: 3.0.3
info:
  title: Nortabil - Motor de Partidas Dobradas (Núcleo ERP Contábil)
  description: |
    API de altíssimo desempenho para processamento de transações contábeis em partidas dobradas.
    Desenvolvida em Go com PostgreSQL para garantir estrita conformidade com a Lei de Luca Pacioli,
    Lei das S.A. (Lei 6.404/76), Código Civil (Lei 10.406/2002) e Resolução CFC ITG 2000.
    Projetada com foco nos escritórios de contabilidade do Norte de Minas Gerais (Januária, Montes Claros e região).
  version: 1.0.0
  contact:
    name: Projeto Nortabil
    url: https://github.com/matheus-sl2/nortabil
servers:
  - url: http://localhost:8080
    description: Servidor Local de Desenvolvimento
paths:
  /healthz:
    get:
      summary: Verificação de saúde da aplicação
      description: Retorna o status operacional da API e a conectividade com o PostgreSQL.
      responses:
        '200':
          description: Serviço saudável e operacional
        '503':
          description: Banco de dados inacessível

  /api/v1/auth/login:
    post:
      summary: Autenticar usuário (Login)
      description: Valida credenciais e retorna token de autenticação JWT assinado com claims de usuário e perfil de acesso (RBAC).
      tags:
        - Autenticação e RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "contador@nortabil.com.br"
                password:
                  type: string
                  example: "Nortabil@2026"
      responses:
        '200':
          description: Login bem-sucedido com token JWT
        '401':
          description: Credenciais inválidas

  /api/v1/auth/register:
    post:
      summary: Cadastrar novo usuário (Contador, Assistente ou Admin)
      description: Cria usuário no sistema contábil com senha hasheada em Bcrypt com salt.
      tags:
        - Autenticação e RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                  example: "João Silva Santos"
                email:
                  type: string
                  example: "joao@nortabil.com.br"
                password:
                  type: string
                  example: "Senha@123"
                role:
                  type: string
                  enum: [ADMIN, CONTADOR, ASSISTENTE]
                crc_number:
                  type: string
                  example: "MG-099887/O"
      responses:
        '201':
          description: Usuário criado com sucesso

  /api/v1/auth/me:
    get:
      summary: Dados do usuário autenticado
      description: Retorna os dados do token JWT do usuário ativo na sessão.
      tags:
        - Autenticação e RBAC
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil do usuário logado

  /api/v1/companies:
    post:
      summary: Cadastrar empresa / cliente do escritório
      description: Registra uma nova empresa no escritório contábil (suporte a Multi-Tenancy). Opcionalmente clona o plano de contas padrão.
      tags:
        - Empresas (Multi-Tenancy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyInput'
      responses:
        '201':
          description: Empresa cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: CNPJ inválido ou dados incorretos
        '409':
          description: Empresa já cadastrada com este CNPJ
    get:
      summary: Listar empresas clientes
      description: Retorna todas as empresas cadastradas no escritório de contabilidade.
      tags:
        - Empresas (Multi-Tenancy)
      parameters:
        - name: active_only
          in: query
          description: Se true, filtra somente empresas ativas
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'

  /api/v1/companies/{id}:
    get:
      summary: Obter detalhes da empresa
      tags:
        - Empresas (Multi-Tenancy)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Empresa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          description: Empresa não encontrada

  /api/v1/periods:
    get:
      summary: Listar períodos contábeis do ano
      description: Retorna o status de abertura ou fechamento de cada um dos 12 meses do ano contábil.
      tags:
        - Períodos e Fechamentos
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
        - name: X-Company-ID
          in: header
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista dos períodos contábeis do ano

  /api/v1/periods/close:
    post:
      summary: Fechar período contábil mensal
      description: Bloqueia a inclusão ou alteração de lançamentos retroativos no mês especificado.
      tags:
        - Períodos e Fechamentos
      parameters:
        - name: X-Company-ID
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year:
                  type: integer
                  example: 2026
                month:
                  type: integer
                  example: 10
                closed_by:
                  type: string
                  example: "Contador Responsável CRC/MG 12345"
      responses:
        '200':
          description: Período fechado com sucesso
        '404':
          description: Período não encontrado

  /api/v1/periods/reopen:
    post:
      summary: Reabrir período contábil
      description: Permite ao contador reabrir um mês previamente encerrado (desde que não esteja travado por auditoria).
      tags:
        - Períodos e Fechamentos
      parameters:
        - name: X-Company-ID
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year:
                  type: integer
                  example: 2026
                month:
                  type: integer
                  example: 10
      responses:
        '200':
          description: Período reaberto com sucesso
        '403':
          description: Período travado (LOCKED) não pode ser reaberto

  /api/v1/periods/closing-year:
    post:
      summary: Apuração do Resultado do Exercício (ARE)
      description: Zera todas as contas de Receita e Despesa do ano fiscal e transfere o resultado líquido (lucro ou prejuízo) para o Patrimônio Líquido.
      tags:
        - Períodos e Fechamentos
      parameters:
        - name: X-Company-ID
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              properties:
                year:
                  type: integer
                  example: 2026
                result_account_id:
                  type: string
                  format: uuid
                  description: UUID da conta analítica de Lucros ou Prejuízos Acumulados no Patrimônio Líquido
      responses:
        '200':
          description: Exercício encerrado com sucesso com lançamento contábil de ARE gerado

  /api/v1/accounts:
    post:
      summary: Criar conta contábil
      description: Registra uma nova conta no plano de contas (sintética ou analítica).
      tags:
        - Contas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountInput'
      responses:
        '201':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Dados inválidos no cadastro
        '409':
          description: Código contábil já existente
    get:
      summary: Listar plano de contas
      description: Retorna as contas cadastradas. Suporta exibição em árvore hierárquica ou plana.
      tags:
        - Contas
      parameters:
        - name: tree
          in: query
          description: Se true, retorna a estrutura organizada em árvore com nós pais e filhos
          schema:
            type: boolean
        - name: active_only
          in: query
          description: Se true, filtra somente contas ativas
          schema:
            type: boolean
      responses:
        '200':
          description: Lista ou árvore de contas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'

  /api/v1/accounts/{id}:
    get:
      summary: Obter conta por ID
      tags:
        - Contas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Conta não encontrada

  /api/v1/accounts/code/{code}:
    get:
      summary: Obter conta por código estruturado
      tags:
        - Contas
      parameters:
        - name: code
          in: path
          required: true
          example: "1.1.01.001"
          schema:
            type: string
      responses:
        '200':
          description: Conta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Conta não encontrada

  /api/v1/journal-entries:
    post:
      summary: Registrar lançamento contábil
      description: |
        Registra um lançamento no Livro Diário com partidas dobradas.
        Aplica a Lei de Luca Pacioli: a soma dos débitos deve ser estritamente igual à dos créditos.
        Exige contas analíticas e ativas.
      tags:
        - Lançamentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJournalEntryInput'
      responses:
        '201':
          description: Lançamento registrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        '400':
          description: Partidas inválidas ou valores negativos
        '422':
          description: Desbalanceamento de partidas dobradas ou uso de conta sintética
    get:
      summary: Listar lançamentos contábeis
      description: Consulta o histórico de lançamentos com suporte a período e paginação.
      tags:
        - Lançamentos
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            enum: [POSTED, DRAFT, REVERSED]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista paginada de lançamentos

  /api/v1/journal-entries/batch:
    post:
      summary: Lote de lançamentos contábeis
      description: Ingestão massiva em alta velocidade com concorrência para fechamentos contábeis mensais.
      tags:
        - Lançamentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateJournalEntryInput'
      responses:
        '200':
          description: Relatório do processamento em lote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchProcessReport'

  /api/v1/journal-entries/{id}:
    get:
      summary: Obter lançamento completo por ID
      tags:
        - Lançamentos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lançamento completo com partidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        '404':
          description: Lançamento não encontrado

  /api/v1/reports/ledger:
    get:
      summary: Gerar Livro Razão
      description: Emite o Livro Razão contábil detalhado por conta com saldo anterior, movimentações cronológicas e saldo final.
      tags:
        - Relatórios Legais
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: account_id
          in: query
          description: UUID opcional de conta analítica específica
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Relatório do Livro Razão

  /api/v1/reports/journal:
    get:
      summary: Gerar Livro Diário Geral
      description: Emite a relação cronológica de todas as operações contábeis no período.
      tags:
        - Relatórios Legais
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Relatório do Livro Diário Geral

  /api/v1/reports/trial-balance:
    get:
      summary: Gerar Balancete de Verificação
      description: Emite o balancete analítico e sintético para conferência do equilíbrio patrimonial.
      tags:
        - Relatórios Legais
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Balancete de Verificação

  /api/v1/reports/dre:
    get:
      summary: Demonstração do Resultado do Exercício (DRE)
      description: Emite a DRE estruturada com Receita Bruta, Deduções, Receita Líquida, Custos (CMV), Lucro Bruto, Despesas Operacionais, Resultado Operacional e Lucro/Prejuízo Líquido conforme a Lei 6.404/76 e NBC TG 26.
      tags:
        - Relatórios Legais
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Demonstração do Resultado do Exercício
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DREReport'

  /api/v1/reports/balance-sheet:
    get:
      summary: Balanço Patrimonial Estruturado
      description: Emite o Balanço Patrimonial formal com a segregação de Ativo Circulante, Não Circulante, Passivo Circulante, Não Circulante e Patrimônio Líquido com verificação matemática de equilíbrio (Ativo = Passivo + PL).
      tags:
        - Relatórios Legais
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Balanço Patrimonial Estruturado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSheetReport'

  /api/v1/reports/export/csv:
    get:
      summary: Exportar Relatórios para Planilha CSV (Excel)
      description: Gera arquivo CSV com encoding UTF-8 com BOM e separador de ponto e vírgula para abertura automática e compatível no Microsoft Excel.
      tags:
        - Relatórios Legais
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [trial-balance, dre]
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Planilha em formato CSV para download
          content:
            text/csv:
              schema:
                type: string

  /api/v1/reports/export/print:
    get:
      summary: Relatório Oficial para Impressão e PDF
      description: Retorna página HTML5 estilizada com CSS para impressão ou geração de PDF oficial contendo folha de rosto, cabeçalho da empresa, termos de escrituração e campos de assinatura do Contador e do Representante Legal.
      tags:
        - Relatórios Legais
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [trial-balance, dre, balance-sheet]
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Layout HTML de impressão
          content:
            text/html:
              schema:
                type: string

  /api/v1/periods:
    get:
      summary: Listar Períodos Contábeis
      description: Lista o histórico de status de fechamento dos meses fiscais da empresa.
      tags:
        - Períodos e ARE
      responses:
        '200':
          description: Lista de períodos contábeis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingPeriod'

  /api/v1/periods/close:
    post:
      summary: Fechar Período Contábil (Trava de Mês)
      description: Bloqueia novos lançamentos retroativos no mês especificado para garantir a inviolabilidade da escrituração.
      tags:
        - Períodos e ARE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year:
                  type: integer
                  example: 2026
                month:
                  type: integer
                  example: 10
      responses:
        '200':
          description: Período encerrado com sucesso

  /api/v1/periods/reopen:
    post:
      summary: Reabrir Período Contábil
      description: Reabre o período contábil mediante justificativa do responsável técnico.
      tags:
        - Períodos e ARE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year:
                  type: integer
                  example: 2026
                month:
                  type: integer
                  example: 10
      responses:
        '200':
          description: Período reaberto com sucesso

  /api/v1/periods/closing-year:
    post:
      summary: Apuração do Resultado do Exercício (ARE Anual)
      description: Zera todas as contas analíticas de Resultado (Receitas e Despesas) e transfere o Lucro Líquido ou Prejuízo Acumulado para o Patrimônio Líquido.
      tags:
        - Períodos e ARE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              properties:
                year:
                  type: integer
                  example: 2026
      responses:
        '200':
          description: ARE processada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearClosingResult'

  /api/v1/reconciliation/import-ofx:
    post:
      summary: Importar Extrato Bancário OFX e Conciliar Automaticamente
      description: Processa extratos bancários em formato OFX (SGML/XML), gerando automaticamente as partidas dobradas entre a Conta Bancária do Ativo e a Conta de Contrapartida informada, evitando lançamentos duplicados por FITID.
      tags:
        - Conciliação Bancária
      parameters:
        - name: bank_account_id
          in: query
          required: false
          description: UUID da conta contábil bancária do Ativo (obrigatório se não enviado no form)
          schema:
            type: string
            format: uuid
        - name: counterpart_account_id
          in: query
          required: false
          description: UUID da conta de contrapartida (ex. Clientes ou Fornecedores)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bank_account_id, counterpart_account_id, file]
              properties:
                bank_account_id:
                  type: string
                  format: uuid
                counterpart_account_id:
                  type: string
                  format: uuid
                file:
                  type: string
                  format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Resumo do processamento do extrato OFX
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OFXImportSummary'

  /api/v1/reconciliation/items:
    get:
      summary: Listar Itens de Extrato Bancário
      description: Retorna os registros importados do extrato bancário com seu status de conciliação e partida contábil associada.
      tags:
        - Conciliação Bancária
      parameters:
        - name: bank_account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: unreconciled_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Lista de itens do extrato
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankStatementItem'

  /api/v1/export/sped-ecd:
    get:
      summary: Exportar Escrituração Contábil Digital (SPED ECD)
      description: Gera o arquivo oficial do SPED ECD (Livro Diário Geral - Forma G) com os Blocos 0, I, J e 9 em estrita conformidade com o Manual de Orientação do Leiaute da ECD (RFB/CFC).
      tags:
        - Exportação Fiscal e SPED
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: auditor_crc
          in: query
          schema:
            type: string
            example: "MG-085421/O"
        - name: auditor_name
          in: query
          schema:
            type: string
            example: "Sebastião Ferreira da Silva"
        - name: auditor_cpf
          in: query
          schema:
            type: string
            example: "12345678909"
        - name: signatory_name
          in: query
          schema:
            type: string
            example: "Manoel de Oliveira"
        - name: signatory_cpf
          in: query
          schema:
            type: string
            example: "98765432100"
      responses:
        '200':
          description: Arquivo SPED ECD pronto para importação e validação no PVA da Receita Federal
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    CreateCompanyInput:
      type: object
      required:
        - cnpj
        - legal_name
        - tax_regime
      properties:
        cnpj:
          type: string
          example: "03.743.085/0001-20"
        legal_name:
          type: string
          example: "Agropecuária Vale do São Francisco Ltda"
        trade_name:
          type: string
          example: "Agro Januária"
        tax_regime:
          type: string
          enum: [SIMPLES_NACIONAL, LUCRO_PRESUMIDO, LUCRO_REAL, MEI]
        city:
          type: string
          example: "Januária"
        state:
          type: string
          example: "MG"
        clone_default_accounts:
          type: boolean
          default: true
          description: Se true, replica toda a estrutura hierárquica do plano de contas referencial padrão para esta nova empresa

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
