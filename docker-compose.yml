version: '3.8'

services:
  # Banco de Dados Relacional PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: nortabil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nortabil_db}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nortabil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nortabil_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nortabil-net

  # API do Motor de Partidas Dobradas (Go)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nortabil-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      PORT: 8080
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-nortabil_db}?sslmode=disable
      DB_MAX_CONNS: 50
      DB_MIN_CONNS: 10
      DB_MAX_CONN_LIFETIME_MINUTES: 30
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
    ports:
      - "8080:8080"
    networks:
      - nortabil-net

volumes:
  nortabil_pgdata:
    name: nortabil_pgdata

networks:
  nortabil-net:
    name: nortabil-net
    driver: bridge
